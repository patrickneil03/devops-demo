name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML file
        run: test -f index.html

      - name: Check CSS file
        run: test -f style.css

      - name: Build Docker image
        run: docker build -t devops-demo:latest .